name: Update Profile Contributions + Email Report

on:
  schedule:
    - cron: "0 12 * * *" # every day at 12 PM UTC
  workflow_dispatch:

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PROFILE_USER: ${{ secrets.PROFILE_USER }}
      PROFILE_FEED: commits

    steps:
      # -----------------------
      # 1. Checkout repo
      # -----------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------
      # 2. Setup Node
      # -----------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # -----------------------
      # 3. Install GitHub CLI
      # -----------------------
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # -----------------------
      # 4. Configure GitHub CLI
      # -----------------------
      - name: Configure GitHub CLI
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "Missing required secret GH_PAT (repo PAT with PR read access)."
            exit 1
          fi
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      # -----------------------
      # 5. Generate contributions
      # -----------------------
      - name: Update contributions
        run: node scripts/update-readme.js

      # -----------------------
      # 6. Create diff
      # -----------------------
      - id: diff
        name: Create diff
        run: |
          git diff -- README.md > changes.txt || true
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          cat changes.txt
          echo "EOF" >> "$GITHUB_OUTPUT"

      # -----------------------
      # 7. Commit changes
      # -----------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: update profile contributions" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push after 3 attempts."
              exit 1
            fi
            sleep 5
          done

      # -----------------------
      # 7. Send email (SMTP)
      # -----------------------
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "GitHub Profile Updated - Daily Report"
          to: dhanushkalakshan18@gmail.com
          from: GitHub Actions <${{ secrets.EMAIL_USER }}>
          body: |
            🚀 Daily GitHub Profile Update

            👉 View profile: https://github.com/${{ github.repository_owner }}

            Your profile README has been updated.

            📌 Summary:
            - Contributions section refreshed
            - Latest commit activity included

            📄 Diff:
            ${{ steps.diff.outputs.content }}
          html_body: |
            <div style="font-family:Segoe UI,Helvetica,Arial,sans-serif;line-height:1.6;">
              <p>🚀 Daily GitHub Profile Update</p>
              <p><strong><a href="https://github.com/${{ github.repository_owner }}">View profile</a></strong></p>
              <p>Your profile README has been updated.</p>
              <h3>📌 Summary</h3>
              <ul>
                <li>Contributions section refreshed</li>
                <li>Latest commit activity included</li>
              </ul>
              <h3>📄 Diff</h3>
              <pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;background:#f6f8fa;padding:12px;border-radius:8px;">${{ steps.diff.outputs.content }}</pre>
            </div>