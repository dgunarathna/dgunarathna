name: GitHub Activity Alerts

on:
  workflow_dispatch:

concurrency:
  group: github-activity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      PROFILE_USER: ${{ secrets.PROFILE_USER }}
      EXCLUDED_USERS: dgunarathna,dhanushkacreately

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Configure GitHub CLI
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "Missing required secret GH_PAT."
            exit 1
          fi
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Track GitHub activity
        id: track
        run: node scripts/track-github-activity.js

      - name: Commit activity state
        if: steps.track.outputs.state_updated == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/github-activity-state.json
          git commit -m "chore: update github activity state" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push after 3 attempts."
              exit 1
            fi
            sleep 5
          done

      - name: Send activity alert email
        if: steps.track.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "GitHub Activity Alert - Someone engaged with your profile"
          to: dhanushkalakshan18@gmail.com
          from: GitHub Actions <${{ secrets.EMAIL_USER }}>
          body: file://activity-report.txt
          html_body: file://activity-report.html
